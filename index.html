<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lotus Garden</title>
<style>
:root{--bg:#fbfaf8;--card:#fff;--ink:#243237;--muted:#718087;--line:#e2dde4;--a:#6d567d;--b:#277174;--soft:#ede6f2}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:radial-gradient(circle at 5% 0,#eee7f4,transparent 35rem),var(--bg);font:15px/1.45 system-ui,sans-serif}body.dusk{--bg:#1f2027;--card:#30313d;--ink:#f6f2f8;--muted:#c7c2ce;--line:#50515e;--a:#c7a8dd;--b:#78c8c7;--soft:#453a51}body.ocean{--a:#2563a5;--b:#087f8c;--soft:#e2effb}body.sunset{--a:#a14e55;--b:#b96b32;--soft:#fae8df}button,input{font:inherit}button{cursor:pointer;border:0;color:inherit}button:focus-visible,input:focus-visible{outline:3px solid var(--b);outline-offset:2px}.app{min-height:100vh;padding-bottom:94px}.top{max-width:1060px;margin:auto;padding:24px;display:flex;justify-content:space-between}.brand{display:flex;gap:12px;align-items:center}.mark{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(135deg,var(--a),var(--b));color:#fff;font-size:24px}.brand b{display:block;letter-spacing:.16em;color:var(--a)}.brand small{color:var(--muted)}.top button{width:42px;height:42px;border-radius:50%;background:var(--card);border:1px solid var(--line);margin-left:6px}.main{max-width:1060px;margin:auto;padding:24px}.head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:15px 0}.eyebrow{color:var(--muted);font-size:12px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;margin:0 0 5px}h1{margin:0;color:var(--a);font-size:clamp(36px,6vw,56px);letter-spacing:-.06em;line-height:1}h2{margin:0 0 7px}h3{margin:0 0 5px}.muted{color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:0 18px 48px #4b3c5514}.hero{display:grid;grid-template-columns:1fr 190px;gap:20px;align-items:center;padding:28px;background:linear-gradient(135deg,var(--soft),#dceadf)}body.dusk .hero{background:linear-gradient(135deg,#40374b,#294543)}.hero h2{font-size:clamp(25px,4vw,38px);max-width:16ch;color:var(--a);line-height:1.08}.hero p{color:var(--muted);max-width:50ch}.actions{display:flex;flex-wrap:wrap;gap:8px}.primary,.secondary,.ghost{min-height:42px;border-radius:12px;padding:10px 15px;font-weight:800}.primary{background:var(--a);color:#fff}.secondary{background:var(--b);color:#fff}.ghost{background:var(--card);border:1px solid var(--line);color:var(--a)}.ring{width:145px;height:145px;border-radius:50%;margin:auto;display:grid;place-items:center;background:conic-gradient(var(--b) 72deg,var(--soft) 0)}.ring:after{content:"";grid-area:1/1;width:112px;height:112px;border-radius:50%;background:var(--card)}.ring strong,.ring small{grid-area:1/1;z-index:1;text-align:center}.ring strong{font-size:28px;color:var(--a)}.ring small{margin-top:45px;color:var(--muted);font-weight:700}.quick{display:flex;gap:8px;margin:17px 0}.quick input,.search{flex:1;min-width:0;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}.quick button{padding:10px 18px;background:var(--a);color:#fff;border-radius:12px;font-weight:800}.section{display:flex;justify-content:space-between;align-items:center;margin:26px 0 11px}.section button{background:none;color:var(--b);font-weight:800}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.small{padding:17px;min-height:125px}.badge{display:inline-block;padding:5px 9px;border-radius:99px;background:var(--soft);color:var(--a);font-size:11px;font-weight:800;margin-bottom:12px}.panel{padding:18px}.tasks{display:grid;gap:10px;margin-top:13px}.task{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:start;padding:15px;border:1px solid var(--line);border-radius:16px;background:var(--card)}.task input{width:22px;height:22px;accent-color:var(--b)}.task b.done{text-decoration:line-through;color:var(--muted)}.meta{font-size:12px;color:var(--muted);margin-top:4px}.mini{width:30px;height:30px;border-radius:9px;background:var(--soft);color:var(--muted)}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.filter{padding:8px 13px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-weight:800}.filter.active{background:var(--soft);border-color:var(--a);color:var(--a)}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.calendar button{min-height:65px;text-align:left;padding:7px;border-radius:11px;background:transparent}.calendar button:hover,.calendar .selected{background:var(--soft)}.calendar .today span{display:grid;place-items:center;width:25px;height:25px;border-radius:50%;background:var(--b);color:#fff}.dot{display:block;width:6px;height:6px;border-radius:50%;background:var(--b);margin-top:13px}.settings{display:grid;gap:12px}.setting{padding:17px;display:flex;justify-content:space-between;align-items:center;gap:14px}.setting p{margin:4px 0 0;color:var(--muted);font-size:13px}.switch{width:54px;height:30px;border-radius:99px;background:var(--line);position:relative}.switch:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}.switch.on{background:var(--b)}.switch.on:after{transform:translateX(24px)}.palettes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:13px}.palette{padding:10px 6px;border:1px solid var(--line);border-radius:13px;background:var(--card);font-size:12px;font-weight:800;color:var(--muted)}.palette.active{border-color:var(--a);color:var(--a)}.swatch{height:18px;border-radius:99px;margin-bottom:7px}.nav{position:fixed;z-index:4;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,780px);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 10px;border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;background:var(--card)}.nav button{min-height:55px;border-radius:14px;background:transparent;color:var(--muted);font-size:12px;font-weight:800}.nav button.active{background:var(--soft);color:var(--a)}.nav .add{width:64px;height:64px;min-height:64px;margin:-24px auto 0;border:7px solid var(--bg);border-radius:50%;background:var(--a);color:#fff;font-size:30px}.modal{position:fixed;inset:0;z-index:9;display:none;align-items:flex-end;padding:12px;background:#1c1a2480}.modal.open{display:flex}.sheet{width:min(100%,550px);margin:auto auto 0;padding:20px;border-radius:25px;background:var(--card)}.sheet form{display:grid;gap:12px}.sheet label{display:grid;gap:5px;font-weight:800;font-size:13px}.sheet input{padding:11px;border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--ink)}.toast{position:fixed;z-index:10;bottom:90px;left:50%;transform:translateX(-50%);padding:11px 16px;border-radius:13px;background:var(--ink);color:var(--bg);display:none}.toast.show{display:block}@media(max-width:700px){.main{padding:18px}.top{padding:20px 18px}.hero{grid-template-columns:1fr}.three{grid-template-columns:1fr}.head{align-items:start;flex-direction:column}.palettes{grid-template-columns:repeat(2,1fr)}}
</style><style>
[hidden]{display:none!important}.nav{align-items:center}.nav button{display:grid;place-items:center;line-height:1.15}.nav svg{width:21px;height:21px;margin:auto}.nav .add{align-self:center;margin:0 auto;transform:translateY(-22px)}.sheet select{padding:11px;border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--ink)}body.forest{background:radial-gradient(circle at 8% 0,#dcefe5,transparent 35rem),var(--bg)}body.ocean{background:radial-gradient(circle at 8% 0,#e2effb,transparent 35rem),var(--bg)}body.sunset{background:radial-gradient(circle at 8% 0,#fae8df,transparent 35rem),var(--bg)}body.lavender{background:radial-gradient(circle at 8% 0,#eee7fb,transparent 35rem),var(--bg)}body.dusk.lavender{--a:#eadbff!important;--b:#8ce6e0!important;--soft:#51416a!important;background:radial-gradient(circle at 8% 0,#4b3a62,transparent 35rem),var(--bg)}body.dusk.lavender h1,body.dusk.lavender .brand b,body.dusk.lavender .hero h2{color:#eadbff}body.dusk.lavender .eyebrow{color:#d9c9eb}
</style></head>
<body><div class="app"><header class="top"><div class="brand"><div class="mark">✦</div><div><b>LOTUS GARDEN</b><small>Productivity companion</small></div></div><div><button id="music">♫</button><button id="theme">☾</button><button>SL</button></div></header><main class="main" id="main"></main><nav class="nav"><button data-view="tasks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="m8 12 2.5 2.5L16 9"/></svg><span>To-dos</span></button><button data-view="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></button><button class="add" id="add" aria-label="Add">+</button><button data-view="calendar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg><span>Calendar</span></button><button data-view="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.2-1.5l1.6-1.2-2-3.4-1.8.8a7 7 0 0 0-2.6-1.5L13.8 3h-3.6l-.3 2.2a7 7 0 0 0-2.6 1.5l-1.8-.8-2 3.4 1.6 1.2A7 7 0 0 0 5 12c0 .5.1 1 .2 1.5l-1.6 1.2 2 3.4 1.8-.8a7 7 0 0 0 2.6 1.5l.3 2.2h3.6l.3-2.2a7 7 0 0 0 2.6-1.5l1.8.8 2-3.4-1.6-1.2c.1-.5.2-1 .2-1.5z"/></svg><span>Settings</span></button></nav></div><div class="modal" id="modal"><div class="sheet"><div class="section"><h2 id="modalHeading">Add a task</h2><button class="mini" id="close">×</button></div><form id="form"><label>Entry type<select id="entryType"><option value="task">To-do task</option><option value="event">Calendar event</option></select></label><label>Title<input id="name" required placeholder="What needs doing?"></label><label>Category<input id="category" placeholder="School, work, personal"></label><label id="estimateLabel">Estimated minutes<input id="estimate" type="number" min="1" placeholder="45"></label><label id="importanceLabel">Importance<select id="importance"><option value="1">Low</option><option value="3" selected>Medium</option><option value="5">High</option></select></label><label id="difficultyLabel">Difficulty<select id="difficulty"><option value="1">Easy</option><option value="3" selected>Medium</option><option value="5">Hard</option></select></label><label>Date<input id="due" type="date"></label><label id="timeLabel" hidden>Time<input id="time" type="time" value="18:00"></label><div class="actions"><button type="button" class="ghost" id="cancel">Cancel</button><button class="primary">Save entry</button></div></form></div></div><div id="toast" class="toast"></div>
<script>
const now=new Date(),day=d=>{d=new Date(d);return d.toISOString().slice(0,10)},today=day(now),tomorrow=day(new Date(now.getTime()+864e5));let state;try{state=JSON.parse(localStorage.getItem('lotus-final'))}catch{}state=state||{view:'home',theme:'light',palette:'lotus',music:false,filter:'all',selected:today,tasks:[{id:1,title:'Finish Physics lab reflection',category:'School',due:today,estimate:45,done:false},{id:2,title:'Complete Calc III problem set',category:'School',due:tomorrow,estimate:75,done:false},{id:3,title:'Draft student council agenda',category:'Leadership',due:tomorrow,estimate:30,done:false},{id:4,title:'Prepare tutoring examples',category:'Tutoring',due:null,estimate:30,done:true}]};
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem('lotus-final',JSON.stringify(state))}function note(x){const t=document.getElementById('toast');t.textContent=x;t.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove('show'),1700)}function apply(){document.body.className=(state.theme==='dusk'?'dusk ':'')+state.palette;document.getElementById('music').textContent=state.music?'❚❚':'♫';document.getElementById('theme').textContent=state.theme==='dusk'?'☀':'☾'}
function card(t){return `<article class="task"><input type="checkbox" data-check="${t.id}" ${t.done?'checked':''}><div><b class="${t.done?'done':''}">${esc(t.title)}</b><div class="meta">${esc(t.category||'Personal')} · ${t.due===today?'Due today':t.due?'Due '+new Date(t.due+'T12:00').toLocaleDateString(undefined,{month:'short',day:'numeric'}):'No deadline'}${t.estimate?' · '+t.estimate+' min':''}${t.importance?' · importance '+t.importance+'/5':''}${t.difficulty?' · difficulty '+t.difficulty+'/5':''}</div></div><button class="mini" data-delete="${t.id}">×</button></article>`}
function home(){let open=state.tasks.filter(t=>!t.done),pct=Math.round(state.tasks.filter(t=>t.done).length/state.tasks.length*100);return `<div class="head"><div><p class="eyebrow">${now.toLocaleDateString(undefined,{weekday:'long'})}</p><h1>Today's briefing</h1></div><button class="ghost" data-add>＋ Add something</button></div><form class="quick" id="quick"><input name="title" placeholder="Quick add a task…"><button>Add</button></form><section class="card hero"><div><p class="eyebrow">${now.toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'})}</p><h2>${open.length?'You have '+open.length+' things worth your attention.':'Your day has room to breathe.'}</h2><p>Start with the next small step. The rest can wait until it is time.</p><div class="actions"><button class="primary" data-view="tasks">View my to-dos</button><button class="ghost">◷ Start focus</button></div></div><div class="ring"><strong>${pct}%</strong><small>complete</small></div></section><div class="section"><h2>Work that needs attention</h2><button data-view="tasks">See all →</button></div><section class="three">${open.slice(0,3).map(t=>`<article class="card small"><span class="badge">${esc(t.category||'Open task')}</span><h3>${esc(t.title)}</h3><p class="muted">${t.due===today?'Due today':'Next small step'}</p></article>`).join('')||'<article class="card small"><h3>All clear</h3><p class="muted">Nothing urgent is waiting.</p></article>'}</section><div class="section"><h2>Today's plan</h2><button data-view="calendar">Open calendar →</button></div><section class="card panel"><p><b>4:00 PM</b> &nbsp; Focus on your next task</p><p><b>6:30 PM</b> &nbsp; Student Council meeting</p></section>`}
function tasks(){let l=state.tasks.filter(t=>state.filter==='all'||state.filter==='open'&&!t.done||state.filter==='done'&&t.done);return `<div class="head"><div><p class="eyebrow">A clear place for everything</p><h1>Current to-dos</h1></div><button class="primary" data-add>＋ Add task</button></div><input class="search" id="search" placeholder="Search tasks, notes, or categories"><div class="filters"><button class="filter ${state.filter==='all'?'active':''}" data-filter="all">All</button><button class="filter ${state.filter==='open'?'active':''}" data-filter="open">Open</button><button class="filter ${state.filter==='done'?'active':''}" data-filter="done">Done</button></div><section class="tasks">${l.map(card).join('')||'<div class="card panel muted">No tasks match this view.</div>'}</section>`}
function calendar(){let first=new Date(now.getFullYear(),now.getMonth(),1),n=new Date(now.getFullYear(),now.getMonth()+1,0).getDate(),cells='';for(let i=0;i<(first.getDay()+6)%7;i++)cells+='<button></button>';for(let i=1;i<=n;i++){let k=day(new Date(now.getFullYear(),now.getMonth(),i));cells+=`<button class="${k===today?'today ':''}${k===state.selected?'selected':''}" data-date="${k}"><span>${i}</span>${state.tasks.some(t=>t.due===k)?'<i class="dot"></i>':''}</button>`}return `<div class="head"><div><p class="eyebrow">Plan with breathing room</p><h1>Calendar</h1></div></div><section class="card panel"><div class="section"><button class="ghost">‹</button><h2>${now.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</h2><button class="ghost">›</button></div><div class="calendar">${cells}</div><div class="section"><h2>${new Date(state.selected+'T12:00').toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}</h2></div>${state.tasks.filter(t=>t.due===state.selected).map(t=>`<p>☐ ${esc(t.title)}</p>`).join('')||'<p class="muted">No deadlines on this day.</p>'}</section>`}
function settings(){return `<div class="head"><div><p class="eyebrow">Make the app yours</p><h1>Settings</h1></div></div><div class="settings"><section class="card setting"><div><h3>Appearance</h3><p>Switch between light and dusk mode.</p></div><button class="switch ${state.theme==='dusk'?'on':''}" id="dark"></button></section><section class="card panel"><h3>Color palette</h3><p class="muted">Choose an accent set independently from the theme.</p><div class="palettes">${[['lotus','#6d567d','#277174'],['ocean','#2563a5','#087f8c'],['sunset','#a14e55','#bb6b32']].map(x=>`<button class="palette ${state.palette===x[0]?'active':''}" data-palette="${x[0]}"><div class="swatch" style="background:linear-gradient(90deg,${x[1]},${x[2]})"></div>${x[0]}</button>`).join('')}</div></section><section class="card setting"><div><h3>Lo-fi background</h3><p>${state.music?'Playing a gentle focus loop.':'Add a quiet focus loop while you work.'}</p></div><button class="secondary" id="sm">${state.music?'Pause':'Play'}</button></section></div>`}
function render(){apply();document.getElementById('main').innerHTML=state.view==='home'?home():state.view==='tasks'?tasks():state.view==='calendar'?calendar():settings();bind()}function bind(){document.querySelectorAll('[data-view]').forEach(x=>x.onclick=()=>{state.view=x.dataset.view;save();render()});document.querySelectorAll('[data-add]').forEach(x=>x.onclick=open);document.querySelectorAll('[data-check]').forEach(x=>x.onchange=()=>{let t=state.tasks.find(t=>t.id==x.dataset.check);t.done=x.checked;save();render();note(t.done?'Task completed':'Task reopened')});document.querySelectorAll('[data-delete]').forEach(x=>x.onclick=()=>{state.tasks=state.tasks.filter(t=>t.id!=x.dataset.delete);save();render();note('Task deleted')});document.querySelectorAll('[data-filter]').forEach(x=>x.onclick=()=>{state.filter=x.dataset.filter;save();render()});document.querySelectorAll('[data-date]').forEach(x=>x.onclick=()=>{state.selected=x.dataset.date;save();render()});let q=document.getElementById('quick');if(q)q.onsubmit=e=>{e.preventDefault();let v=q.title.value.trim();if(v){state.tasks.push({id:Date.now(),title:v,category:'Personal',due:null,estimate:null,done:false});save();render();note('Task added')}};let s=document.getElementById('search');if(s)s.oninput=()=>document.querySelectorAll('.task').forEach(x=>x.style.display=x.textContent.toLowerCase().includes(s.value.toLowerCase())?'grid':'none');let d=document.getElementById('dark');if(d)d.onclick=()=>{state.theme=state.theme==='light'?'dusk':'light';save();render()};document.querySelectorAll('[data-palette]').forEach(x=>x.onclick=()=>{state.palette=x.dataset.palette;save();render()});let sm=document.getElementById('sm');if(sm)sm.onclick=music}
function open(){document.getElementById('modal').classList.add('open');document.getElementById('name').focus()}function close(){document.getElementById('modal').classList.remove('open');document.getElementById('form').reset()}function music(){state.music=!state.music;save();render();note(state.music?'Lo-fi on':'Lo-fi off')}document.getElementById('music').onclick=music;document.getElementById('theme').onclick=()=>{state.theme=state.theme==='light'?'dusk':'light';save();render()};document.getElementById('add').onclick=open;document.getElementById('close').onclick=close;document.getElementById('cancel').onclick=close;document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')close()};document.getElementById('form').onsubmit=e=>{e.preventDefault();let v=document.getElementById('name').value.trim();if(!v)return;state.tasks.push({id:Date.now(),title:v,category:document.getElementById('category').value||'Personal',due:document.getElementById('due').value||null,estimate:Number(document.getElementById('estimate').value)||null,done:false});save();close();render();note('Task added')};render();
</script>
<script>
/* Presentation controls: deliberately isolated from the legacy demo handlers above. */
state.events=Array.isArray(state.events)?state.events:[];state.preference=state.preference||'balanced';
const palettes={lotus:['#6d567d','#277174','#ede6f2'],ocean:['#2563a5','#087f8c','#e2effb'],sunset:['#a14e55','#bb6b32','#fae8df'],forest:['#356859','#2f8f6b','#dcefe5'],rose:['#9b4d73','#c66a8b','#f7e2ed'],midnight:['#5367b6','#55b9c2','#e4e9ff'],citrus:['#a46618','#5e9b3c','#fff0c7'],lavender:['#7950a8','#596cc5','#eee7fb']};
let audioCtx=null,musicTimer=null;const notes=[261.63,329.63,392,493.88,392,329.63];
function applyFinal(){const p=palettes[state.palette]||palettes.lotus;document.body.className=(state.theme==='dusk'?'dusk ':'')+state.palette;const dark={lotus:['#d9c4eb','#83d9d5','#51435b'],ocean:['#9bcfff','#7fe0e5','#29425d'],sunset:['#ffb7a4','#f2ae73','#5d3c42'],forest:['#a9e6bd','#86dfb7','#315344'],rose:['#ffb4d7','#ff9fba','#5e3d53'],midnight:['#c4d1ff','#8de9ed','#3c466f'],citrus:['#ffd38a','#b9e986','#5d4922'],lavender:['#eadbff','#8ce6e0','#51416a']}[state.palette]||null;const colors=state.theme==='dusk'&&dark?dark:p;document.body.style.setProperty('--a',colors[0]);document.body.style.setProperty('--b',colors[1]);document.body.style.setProperty('--soft',colors[2]);document.getElementById('music').textContent=state.music?'❚❚':'♫';document.getElementById('theme').textContent=state.theme==='dusk'?'☀':'☾';document.querySelectorAll('.nav [data-view]').forEach(x=>x.classList.toggle('active',x.dataset.view===state.view))}
function startAudio(){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();audioCtx.resume();let i=0;clearInterval(musicTimer);const play=()=>{if(!state.music)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=notes[i++%notes.length];g.gain.setValueAtTime(.0001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.035,audioCtx.currentTime+.05);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.9);o.connect(g).connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.95)};play();musicTimer=setInterval(play,950)}catch{note('Audio is unavailable in this browser')}}
function stopAudio(){clearInterval(musicTimer);musicTimer=null;if(audioCtx)audioCtx.suspend()}
function finalMusic(){state.music=!state.music;if(state.music)startAudio();else stopAudio();save();applyFinal();finalRender();note(state.music?'Lo-fi music playing':'Lo-fi music paused')}
function orderedTasks(){const list=state.tasks.filter(t=>!t.done);const pref=state.preference;return list.sort((a,b)=>{if(pref==='importance')return (b.importance||0)-(a.importance||0);if(pref==='shortest')return (a.estimate||30)-(b.estimate||30);if(pref==='longest')return (b.estimate||30)-(a.estimate||30);if(pref==='category')return String(a.category||'').localeCompare(String(b.category||''));return String(a.due||'9999').localeCompare(String(b.due||'9999'))})}
function planLines(){return orderedTasks().slice(0,4).map((t,i)=>`<p><b>${['4:00 PM','4:45 PM','5:30 PM','7:30 PM'][i]||'Tomorrow'}</b> &nbsp; ${esc(t.title)} <span class="muted">· ${state.preference} priority</span></p>`).join('')}
function finalHome(){const open=state.tasks.filter(t=>!t.done),pct=Math.round(state.tasks.filter(t=>t.done).length/state.tasks.length*100);return `<div class="head"><div><p class="eyebrow">${now.toLocaleDateString(undefined,{weekday:'long'})}</p><h1>Today's briefing</h1></div><button class="ghost" data-add>＋ Add something</button></div><form class="quick" id="quick"><input name="title" placeholder="Quick add a task…"><button>Add</button></form><section class="card hero"><div><p class="eyebrow">${now.toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'})}</p><h2>${open.length?'You have '+open.length+' things worth your attention.':'Your day has room to breathe.'}</h2><p>Your schedule is ordered by <b>${state.preference}</b>. Start with the next small step.</p><div class="actions"><button class="primary" data-view="tasks">View my to-dos</button><button class="ghost" data-view="settings">Change planning preference</button></div></div><div class="ring"><strong>${pct}%</strong><small>complete</small></div></section><div class="section"><h2>Work that needs attention</h2><button data-view="tasks">See all →</button></div><section class="three">${open.slice(0,3).map(t=>`<article class="card small"><span class="badge">${esc(t.category||'Open task')}</span><h3>${esc(t.title)}</h3><p class="muted">${t.due===today?'Due today':'Next small step'}</p></article>`).join('')||'<article class="card small"><h3>All clear</h3><p class="muted">Nothing urgent is waiting.</p></article>'}</section><div class="section"><h2>Daily briefing & plan</h2><button data-view="calendar">Open calendar →</button></div><section class="card panel"><p class="muted">Planning rule: <b>${state.preference}</b></p>${planLines()||'<p class="muted">No open tasks yet.</p>'}${state.events.filter(e=>e.date===today).map(e=>`<p><b>${esc(e.time||'All day')}</b> &nbsp; ${esc(e.title)} <span class="muted">· event</span></p>`).join('')}</section>`}
function finalTasks(){let l=state.tasks.filter(t=>state.filter==='all'||state.filter==='open'&&!t.done||state.filter==='done'&&t.done);return `<div class="head"><div><p class="eyebrow">A clear place for everything</p><h1>Current to-dos</h1></div><button class="primary" data-add>＋ Add task</button></div><input class="search" id="search" placeholder="Search tasks, notes, or categories"><div class="filters"><button class="filter ${state.filter==='all'?'active':''}" data-filter="all">All</button><button class="filter ${state.filter==='open'?'active':''}" data-filter="open">Open</button><button class="filter ${state.filter==='done'?'active':''}" data-filter="done">Done</button></div><section class="tasks">${l.map(card).join('')||'<div class="card panel muted">No tasks match this view.</div>'}</section>`}
function finalCalendar(){let first=new Date(now.getFullYear(),now.getMonth(),1),n=new Date(now.getFullYear(),now.getMonth()+1,0).getDate(),cells='';for(let i=0;i<(first.getDay()+6)%7;i++)cells+='<button></button>';for(let i=1;i<=n;i++){let k=day(new Date(now.getFullYear(),now.getMonth(),i));let has=state.tasks.some(t=>t.due===k)||state.events.some(e=>e.date===k);cells+=`<button class="${k===today?'today ':''}${k===state.selected?'selected':''}" data-date="${k}"><span>${i}</span>${has?'<i class="dot"></i>':''}</button>`}let selectedTasks=state.tasks.filter(t=>t.due===state.selected),selectedEvents=state.events.filter(e=>e.date===state.selected);return `<div class="head"><div><p class="eyebrow">Plan with breathing room</p><h1>Calendar</h1></div><button class="primary" data-event>＋ Add event</button></div><section class="card panel"><div class="section"><button class="ghost">‹</button><h2>${now.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</h2><button class="ghost">›</button></div><div class="calendar">${cells}</div><div class="section"><h2>${new Date(state.selected+'T12:00').toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}</h2></div>${selectedEvents.map(e=>`<p>◉ <b>${esc(e.time||'All day')}</b> &nbsp; ${esc(e.title)} <span class="muted">· event</span></p>`).join('')}${selectedTasks.map(t=>`<p>☐ ${esc(t.title)}</p>`).join('')||(!selectedEvents.length?'<p class="muted">No entries on this day.</p>':'')}</section>`}
function finalSettings(){const names={balanced:'Balanced',deadline:'Deadline first',importance:'Importance first',shortest:'Shortest tasks first',longest:'Longest tasks first',category:'Category first'};return `<div class="head"><div><p class="eyebrow">Make the app yours</p><h1>Settings</h1></div></div><div class="settings"><section class="card setting"><div><h3>Appearance</h3><p>Switch between light and dusk mode.</p></div><button class="switch ${state.theme==='dusk'?'on':''}" id="dark"></button></section><section class="card panel"><h3>Planning preference</h3><p class="muted">Choose what the daily briefing schedules first.</p><select id="preference" style="width:100%;padding:11px;border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--ink)">${Object.entries(names).map(([v,n])=>`<option value="${v}" ${state.preference===v?'selected':''}>${n}</option>`).join('')}</select></section><section class="card panel"><h3>Color palette</h3><p class="muted">Eight accent sets, independent from light/dusk mode.</p><div class="palettes">${Object.entries(palettes).map(([id,p])=>`<button class="palette ${state.palette===id?'active':''}" data-palette="${id}"><div class="swatch" style="background:linear-gradient(90deg,${p[0]},${p[1]})"></div>${id[0].toUpperCase()+id.slice(1)}</button>`).join('')}</div></section><section class="card setting"><div><h3>Lo-fi background</h3><p>${state.music?'Playing a gentle focus loop.':'Add a quiet focus loop while you work.'}</p></div><button class="secondary" id="sm">${state.music?'Pause':'Play'}</button></section><section class="card panel"><h3>Calendar entry</h3><p class="muted">Add events from the calendar page; they appear in the briefing and stay separate from tasks.</p><button class="ghost" data-event>Add an event</button></section></div>`}
function finalRender(){applyFinal();document.getElementById('main').innerHTML=state.view==='home'?finalHome():state.view==='tasks'?finalTasks():state.view==='calendar'?finalCalendar():finalSettings();finalBind()}
function finalBind(){document.querySelectorAll('[data-view]').forEach(x=>x.onclick=()=>{state.view=x.dataset.view;save();finalRender()});document.querySelectorAll('[data-add]').forEach(x=>x.onclick=()=>openFinal('task'));document.querySelectorAll('[data-event]').forEach(x=>x.onclick=()=>openFinal('event'));document.querySelectorAll('[data-check]').forEach(x=>x.onchange=()=>{let t=state.tasks.find(t=>t.id==x.dataset.check);t.done=x.checked;save();finalRender();note(t.done?'Task completed':'Task reopened')});document.querySelectorAll('[data-delete]').forEach(x=>x.onclick=()=>{state.tasks=state.tasks.filter(t=>t.id!=x.dataset.delete);save();finalRender();note('Task deleted')});document.querySelectorAll('[data-filter]').forEach(x=>x.onclick=()=>{state.filter=x.dataset.filter;save();finalRender()});document.querySelectorAll('[data-date]').forEach(x=>x.onclick=()=>{state.selected=x.dataset.date;save();finalRender()});let q=document.getElementById('quick');if(q)q.onsubmit=e=>{e.preventDefault();let v=q.title.value.trim();if(v){state.tasks.push({id:Date.now(),title:v,category:'Personal',due:null,estimate:null,done:false});save();finalRender();note('Task added')}};let s=document.getElementById('search');if(s)s.oninput=()=>document.querySelectorAll('.task').forEach(x=>x.style.display=x.textContent.toLowerCase().includes(s.value.toLowerCase())?'grid':'none');let d=document.getElementById('dark');if(d)d.onclick=()=>{state.theme=state.theme==='light'?'dusk':'light';save();finalRender()};document.querySelectorAll('[data-palette]').forEach(x=>x.onclick=()=>{state.palette=x.dataset.palette;save();finalRender();note('Palette updated')});let p=document.getElementById('preference');if(p)p.onchange=()=>{state.preference=p.value;save();finalRender();note('Planning preference updated')};let sm=document.getElementById('sm');if(sm)sm.onclick=finalMusic}
function openFinal(mode){document.getElementById('modal').classList.add('open');document.getElementById('entryType').value=mode;document.getElementById('modalHeading').textContent=mode==='event'?'Add a calendar event':'Add a task';document.getElementById('estimateLabel').hidden=mode==='event';document.getElementById('importanceLabel').hidden=mode==='event';document.getElementById('difficultyLabel').hidden=mode==='event';document.getElementById('timeLabel').hidden=mode!=='event';document.getElementById('due').value=state.selected||today;document.getElementById('name').focus()}function closeFinal(){document.getElementById('modal').classList.remove('open');document.getElementById('form').reset();document.getElementById('estimateLabel').hidden=false;document.getElementById('importanceLabel').hidden=false;document.getElementById('difficultyLabel').hidden=false;document.getElementById('timeLabel').hidden=true}
document.getElementById('music').onclick=finalMusic;document.getElementById('theme').onclick=()=>{state.theme=state.theme==='light'?'dusk':'light';save();finalRender()};document.getElementById('add').onclick=()=>openFinal('task');document.getElementById('close').onclick=closeFinal;document.getElementById('cancel').onclick=closeFinal;document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeFinal()};document.getElementById('entryType').onchange=e=>openFinal(e.target.value);document.getElementById('form').onsubmit=e=>{e.preventDefault();let title=document.getElementById('name').value.trim(),type=document.getElementById('entryType').value,date=document.getElementById('due').value||today;if(!title)return;if(type==='event')state.events.push({id:Date.now(),title,date,time:document.getElementById('time').value||'18:00'});else state.tasks.push({id:Date.now(),title,category:document.getElementById('category').value||'Personal',due:date,estimate:Number(document.getElementById('estimate').value)||null,importance:Number(document.getElementById('importance').value)||3,difficulty:Number(document.getElementById('difficulty').value)||3,done:false});save();closeFinal();finalRender();note(type==='event'?'Event added to calendar':'Task added')};finalRender();
</script></body></html>
